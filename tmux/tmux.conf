# Setting the default terminal to use 256 colors
set -g default-terminal "screen-256color"

# Always start panes in zsh. Otherwise tmux uses the $SHELL the *server* was
# started with — e.g. a server launched from bash before `chsh` took effect
# keeps giving every new pane bash, so the zsh profile never loads.
run-shell 'command -v zsh >/dev/null && tmux set-option -g default-shell "$(command -v zsh)" || true'
source-file ~/dotfiles/tmux/tmux-keybindings.conf

# System clipboard: every copy-pipe binding (mouse drag, double-click, `y`) with
# no explicit command pipes to copy-command. Wayland -> wl-copy, macOS -> pbcopy,
# otherwise X11 xclip. Also emit OSC 52 for terminals that support it (e.g. SSH).
set -s set-clipboard on
if-shell 'command -v pbcopy' 'set -s copy-command "pbcopy"' \
  'if-shell "[ -n \"$WAYLAND_DISPLAY\" ] && command -v wl-copy" "set -s copy-command wl-copy" "set -s copy-command \"xclip -selection clipboard -i\""'

# don't rename windows automatically
set-option -g allow-rename off

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Your design changes...
# Panes
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightred

# Status bar design
set -g status-style fg=colour12,bg=default
set -g status-interval 2

# Window status
setw -g window-status-style fg=black,bg=green
setw -g window-status-current-style fg=colour11,bg=colour0
setw -g window-status-format " #F#I:#W#F "
setw -g window-status-current-format " #F#I:#W#F "

# Loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off

# The modes
setw -g clock-mode-colour colour135
setw -g mode-style fg=colour196,bg=colour238

# The panes
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour51,bg=colour236

# The statusbar
set -g status-position bottom
set -g status-style fg=colour137,bg=colour234
set -g status-right '#{?client_prefix,#[reverse],}#[fg=colour233,bg=colour245,bold] %A %-I:%M #[fg=colour255,bg=colour000] #(whoami)@#H'

setw -g window-status-current-style fg=colour81,bg=colour238
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-style fg=colour138,bg=colour235
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# The messages
set -g message-style fg=colour232,bg=colour166
